name: KeyFlow
options:
  bundleIdPrefix: jp.keyflow
  deploymentTarget:
    iOS: "17.0"
  developmentLanguage: ja
  createIntermediateGroups: true
  groupSortPosition: top

settings:
  base:
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "5.0"
    # 署名ツールで変えられるよう、IDはビルド設定にまとめる（CIから上書き可能）
    KEYFLOW_BUNDLE_ID: jp.keyflow.ime
    KEYFLOW_APP_GROUP: group.jp.keyflow.ime
    TARGETED_DEVICE_FAMILY: "1"
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: ""
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    DEAD_CODE_STRIPPING: YES

packages:
  KeyFlowKit:
    path: Packages/KeyFlowKit

targets:
  KeyFlow:
    type: application
    platform: iOS
    sources:
      - path: App
        excludes:
          - "Info.plist"
          - "*.entitlements"
    settings:
      base:
        PRODUCT_NAME: KeyFlow
        PRODUCT_BUNDLE_IDENTIFIER: $(KEYFLOW_BUNDLE_ID)
        INFOPLIST_FILE: App/Info.plist
        CODE_SIGN_ENTITLEMENTS: App/KeyFlow.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
    dependencies:
      - target: KeyFlowKeyboard
      - package: KeyFlowKit
        product: KeyFlowCore
      - package: KeyFlowKit
        product: KeyFlowKeyboardUI

  KeyFlowKeyboard:
    type: app-extension
    platform: iOS
    sources:
      - path: Keyboard
        excludes:
          - "Info.plist"
          - "*.entitlements"
    settings:
      base:
        PRODUCT_NAME: KeyFlowKeyboard
        PRODUCT_BUNDLE_IDENTIFIER: $(KEYFLOW_BUNDLE_ID).keyboard
        INFOPLIST_FILE: Keyboard/Info.plist
        CODE_SIGN_ENTITLEMENTS: Keyboard/KeyFlowKeyboard.entitlements
        APPLICATION_EXTENSION_API_ONLY: YES
    dependencies:
      - package: KeyFlowKit
        product: KeyFlowCore
      - package: KeyFlowKit
        product: KeyFlowEngine
      - package: KeyFlowKit
        product: KeyFlowKeyboardUI

  KeyFlowUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: UITests
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(KEYFLOW_BUNDLE_ID).uitests
        GENERATE_INFOPLIST_FILE: YES
    dependencies:
      - target: KeyFlow

schemes:
  KeyFlow:
    build:
      targets:
        KeyFlow: all
        KeyFlowKeyboard: all
    test:
      targets:
        - KeyFlowUITests
