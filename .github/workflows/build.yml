name: Build

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      bundle_id:
        description: "バンドルID（署名でIDが使えないときに変える）"
        required: false
        default: "jp.keyflow.ime"
      app_group:
        description: "App Group ID"
        required: false
        default: "group.jp.keyflow.ime"

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  BUNDLE_ID: ${{ inputs.bundle_id || 'jp.keyflow.ime' }}
  APP_GROUP: ${{ inputs.app_group || 'group.jp.keyflow.ime' }}
  SWIFT_LINUX_URL: https://download.swift.org/swift-6.3.3-release/ubuntu2404/swift-6.3.3-RELEASE/swift-6.3.3-RELEASE-ubuntu24.04.tar.gz

jobs:
  core:
    name: Core tests and conversion eval (Linux)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install Swift
        run: |
          curl -sSfL -o swift.tar.gz "$SWIFT_LINUX_URL"
          mkdir -p "$HOME/swift"
          tar xzf swift.tar.gz -C "$HOME/swift" --strip-components=1
          echo "$HOME/swift/usr/bin" >> "$GITHUB_PATH"
      - uses: actions/cache@v4
        with:
          path: Packages/KeyFlowKit/.build
          key: linux-build-${{ hashFiles('Packages/KeyFlowKit/Package.swift', 'Packages/KeyFlowKit/Package.resolved') }}
      - name: Unit tests
        working-directory: Packages/KeyFlowKit
        run: swift test
      - name: Conversion evaluation
        working-directory: Packages/KeyFlowKit
        run: |
          swift build -c release --product KeyFlowEval
          .build/release/KeyFlowEval ../../eval/corpus.tsv | tee ../../eval-report.md
          cat ../../eval-report.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: eval-report
          path: eval-report.md

  ios:
    name: iOS build, IPA, simulator tests
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - name: Tools
        run: |
          brew install xcodegen
          xcodebuild -version
          swift --version
      - name: Generate Xcode project
        run: xcodegen generate
      - uses: actions/cache@v4
        with:
          path: ~/Library/Developer/Xcode/DerivedData/**/SourcePackages
          key: spm-${{ hashFiles('Packages/KeyFlowKit/Package.swift', 'Packages/KeyFlowKit/Package.resolved') }}
      - name: Build for device (unsigned)
        run: |
          set -o pipefail
          xcodebuild build \
            -project KeyFlow.xcodeproj -scheme KeyFlow -configuration Release \
            -sdk iphoneos -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            KEYFLOW_BUNDLE_ID="$BUNDLE_ID" KEYFLOW_APP_GROUP="$APP_GROUP" \
            2>&1 | tee build-device.log | grep -E "error:|warning: .*KeyFlow|BUILD (SUCCEEDED|FAILED)" || true
          grep -q "BUILD SUCCEEDED" build-device.log
      - name: Package IPA
        run: scripts/package-ipa.sh build/Build/Products/Release-iphoneos/KeyFlow.app "$PWD/KeyFlow.ipa" "$APP_GROUP"
      - uses: actions/upload-artifact@v4
        with:
          name: KeyFlow-ipa
          path: KeyFlow.ipa
          retention-days: 30
      - name: Publish latest IPA as a release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="$(date -u +%Y-%m-%d) ${GITHUB_SHA::7}"
          cat > release-notes.md <<NOTES
          自動ビルド（${VERSION}）

          - \`KeyFlow.ipa\` をダウンロードし、Sideloadlyで署名してインストールします（[手順](https://github.com/${GITHUB_REPOSITORY}/blob/main/docs/INSTALL.md)）。
          - 無料のApple Accountでの署名は7日で期限が切れます。期限が切れたら、同じファイルでもう一度インストールしてください。
          - コミット: ${GITHUB_SHA}
          NOTES
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest KeyFlow.ipa --title "最新ビルド（${VERSION}）" --notes-file release-notes.md --prerelease --target "$GITHUB_SHA"
      - name: Package tests on simulator
        working-directory: Packages/KeyFlowKit
        run: |
          set -o pipefail
          DEST="$(../../scripts/pick-simulator.sh)"
          xcodebuild test -scheme KeyFlowKit-Package -destination "$DEST" 2>&1 | tee ../../test-package.log | grep -E "error:|✘|Test run|Executed|TEST (SUCCEEDED|FAILED)" || true
          grep -qE "TEST SUCCEEDED|Test run with .* passed" ../../test-package.log
      - name: Build for simulator tests
        run: |
          set -o pipefail
          DEST="$(scripts/pick-simulator.sh)"
          echo "SIM_UDID=${DEST##*id=}" >> "$GITHUB_ENV"
          xcodebuild build-for-testing -project KeyFlow.xcodeproj -scheme KeyFlow -destination "$DEST" \
            -derivedDataPath build-sim \
            CODE_SIGN_IDENTITY="-" CODE_SIGN_STYLE=Manual DEVELOPMENT_TEAM="" CODE_SIGNING_REQUIRED=NO \
            KEYFLOW_BUNDLE_ID="$BUNDLE_ID" KEYFLOW_APP_GROUP="$APP_GROUP" \
            2>&1 | tee build-sim.log | grep -E "error:|BUILD (SUCCEEDED|FAILED)" || true
          grep -qE "BUILD SUCCEEDED" build-sim.log
      - name: UI tests with screenshots
        continue-on-error: true
        run: |
          set -o pipefail
          XCTESTRUN="$(ls build-sim/Build/Products/*.xctestrun | head -1)"
          xcodebuild test-without-building -xctestrun "$XCTESTRUN" -destination "id=$SIM_UDID" \
            -skip-testing:KeyFlowUITests/KeyboardExtensionUITests \
            -resultBundlePath TestResults.xcresult \
            2>&1 | tee test-ui.log | grep -E "error:|Test Case|TEST (EXECUTE )?(SUCCEEDED|FAILED)" || true
          grep -qE "TEST (EXECUTE )?SUCCEEDED" test-ui.log
      - name: Keyboard extension as the system keyboard (simulator)
        continue-on-error: true
        run: |
          set -o pipefail
          XCTESTRUN="$(ls build-sim/Build/Products/*.xctestrun | head -1)"
          APP="$(ls -d build-sim/Build/Products/*-iphonesimulator/KeyFlow.app | head -1)"
          xcrun simctl shutdown "$SIM_UDID" 2>/dev/null || true
          # ソフトウェアキーボードを表示させる（ハードウェアキーボード接続扱いを解除）
          defaults write com.apple.iphonesimulator ConnectHardwareKeyboard -bool false
          xcrun simctl boot "$SIM_UDID"
          xcrun simctl bootstatus "$SIM_UDID" -b
          # 先にアプリを入れておかないと、キーボードの登録が無効として捨てられる
          xcrun simctl install "$SIM_UDID" "$APP"
          xcrun simctl spawn "$SIM_UDID" defaults write -g AppleKeyboards -array "${BUNDLE_ID}.keyboard" "emoji@sw=Emoji"
          xcrun simctl spawn "$SIM_UDID" defaults write -g AppleKeyboardsExpanded -int 1
          # 設定を確実に読み直させるため再起動する
          xcrun simctl shutdown "$SIM_UDID"
          xcrun simctl boot "$SIM_UDID"
          xcrun simctl bootstatus "$SIM_UDID" -b
          echo "AppleKeyboards:"; xcrun simctl spawn "$SIM_UDID" defaults read -g AppleKeyboards || true
          # テスト中のキーボード拡張のメモリ使用量を1秒ごとに記録する（シミュレーターの値で、実機とは異なる）
          (
            while true; do
              PID="$(pgrep -f 'KeyFlowKeyboard.appex/KeyFlowKeyboard' | head -1 || true)"
              if [ -n "$PID" ]; then
                FP="$(sudo vmmap --summary "$PID" 2>/dev/null | grep -E '^Physical footprint' | tr -s ' ' | paste -sd ';' - || true)"
                RSS="$(ps -o rss= -p "$PID" 2>/dev/null | tr -d ' ' || true)"
                echo "$(date +%T) pid=$PID rss_kb=$RSS $FP" >> extension-memory.log
              fi
              sleep 1
            done
          ) &
          SAMPLER=$!
          xcodebuild test-without-building -xctestrun "$XCTESTRUN" -destination "id=$SIM_UDID" \
            -only-testing:KeyFlowUITests/KeyboardExtensionUITests \
            -resultBundlePath ExtensionResults.xcresult \
            2>&1 | tee test-extension.log | grep -E "error:|Test Case|TEST (EXECUTE )?(SUCCEEDED|FAILED)" || true
          kill "$SAMPLER" 2>/dev/null || true
          {
            echo "## キーボード拡張のメモリ（シミュレーター）"
            echo
            if [ -s extension-memory.log ]; then
              echo "- 最大RSS: $(awk '{ for (i = 1; i <= NF; i++) if ($i ~ /^rss_kb=/) { v = substr($i, 8) + 0; if (v > m) m = v } } END { printf "%.1f MB", m / 1024 }' extension-memory.log)"
              echo "- 最後の計測: \`$(tail -1 extension-memory.log)\`"
            else
              echo "- 計測できなかった"
            fi
          } >> "$GITHUB_STEP_SUMMARY"
          echo "AppleKeyboards after:"; xcrun simctl spawn "$SIM_UDID" defaults read -g AppleKeyboards || true
          grep -qE "TEST (EXECUTE )?SUCCEEDED" test-extension.log
      - name: Export screenshots
        if: always()
        run: |
          mkdir -p screenshots
          if [ -d TestResults.xcresult ]; then
            xcrun xcresulttool export attachments --path TestResults.xcresult --output-path screenshots || true
          fi
          if [ -d ExtensionResults.xcresult ]; then
            mkdir -p screenshots/extension
            xcrun xcresulttool export attachments --path ExtensionResults.xcresult --output-path screenshots/extension || true
          fi
          ls screenshots | head -50
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: screenshots
          path: screenshots
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: logs
          path: |
            build-device.log
            test-package.log
            build-sim.log
            test-ui.log
            test-extension.log
            extension-memory.log
